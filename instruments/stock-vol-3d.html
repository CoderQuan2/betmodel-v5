  segs.sort(function(p,q){return p.depth-q.depth;});
  segs.forEach(function(sg){ ctx.beginPath(); ctx.moveTo(sg.a[0],sg.a[1]); ctx.lineTo(sg.b[0],sg.b[1]); ctx.strokeStyle=sg.color; ctx.lineWidth=2.6*dpr; ctx.stroke(); });
  // endpoints + labels
  ctx.font='700 '+(11.5*dpr)+'px sans-serif';
  NAMES.forEach(function(t){ var pts=S[t], last=pts[pts.length-1];
    var xy=proj(norm(pts.length-1,last.vol,last.cum));
    ctx.beginPath(); ctx.arc(xy[0],xy[1],5*dpr,0,7); ctx.fillStyle=COLORS[t]; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.3*dpr; ctx.stroke();
    ctx.fillStyle=tc; ctx.fillText(t+' '+(last.cum>0?'+':'')+last.cum+'% · vol '+last.vol+'%', xy[0]+9*dpr, xy[1]-7*dpr);
    var st=proj(norm(0,pts[0].vol,pts[0].cum));
    ctx.beginPath(); ctx.arc(st[0],st[1],3*dpr,0,7); ctx.fillStyle=COLORS[t]; ctx.globalAlpha=0.65; ctx.fill(); ctx.globalAlpha=1;
  });
}
var lg=document.getElementById('legend');
lg.innerHTML=NAMES.map(function(t){ return '<span><span style="color:'+COLORS[t]+';">&#9632;</span> '+t+'</span>'; }).join('');
var dragging=false,lx=0,ly=0;
cv.addEventListener('pointerdown',function(e){ dragging=true; lx=e.clientX; ly=e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',function(e){ if(!dragging) return; az+=(e.clientX-lx)*0.008; el+=(e.clientY-ly)*0.006; el=Math.max(0.12,Math.min(1.35,el)); lx=e.clientX; ly=e.clientY; draw(); });
cv.addEventListener('pointerup',function(){ dragging=false; });
setInterval(function(){ if(!dragging){ az+=0.004; draw(); } },40);
draw();
})();
</script>
