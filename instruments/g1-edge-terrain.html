<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G1 Edge Terrain — BetFi Xii</title>
<script>
/* BetFi instrument guard (v12.30): a failure anywhere in this
   page prints itself in a banner instead of leaving a silent
   blank page — screenshot the banner and the fault is named. */
window.__betfiErrorShown = false;
window.__betfiShowError = function (msg) {
  if (window.__betfiErrorShown) return;
  window.__betfiErrorShown = true;
  var show = function () {
    var b = document.createElement('div');
    b.setAttribute('style', 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#7a1020;color:#fff;font:13px/1.45 system-ui,sans-serif;padding:10px 12px;white-space:pre-wrap;word-break:break-word;');
    b.textContent = 'This instrument hit an error: ' + msg;
    if (document.body) document.body.appendChild(b);
  };
  if (document.body) show();
  else document.addEventListener('DOMContentLoaded', show);
};
window.addEventListener('error', function (e) {
  window.__betfiShowError((e && e.message) ? e.message : 'unknown script error');
});
window.addEventListener('unhandledrejection', function (e) {
  window.__betfiShowError('unhandled promise rejection: ' + ((e && e.reason && e.reason.message) || e.reason || 'unknown'));
});
</script>
<style>
  body { margin:0; background:#0b0f16; color:#dbe4f0;
         font-family:system-ui,sans-serif; }
  .wrap { box-sizing:border-box; padding:10px 12px; }
  .title { font-weight:600; font-size:15px; margin-bottom:2px; }
  .sub { color:#8fa1b8; font-size:12px; margin-bottom:6px; }
  #stamp { color:#a9bcd4; font-size:12px; margin-bottom:8px;
           min-height:16px; }
  .btns { margin-bottom:8px; }
  .btns button { background:#16202e; color:#dbe4f0;
    border:1px solid #2c3e55; border-radius:6px;
    padding:5px 12px; font-size:12px; margin-right:6px;
    cursor:pointer; }
  .btns button.on { background:#1d4e5f; border-color:#35d0ff;
    color:#bfefff; }
  #cv { width:100%; display:block; touch-action:none;
    cursor:grab; background:#0e141f; border-radius:10px; }
  #lab { font-size:12px; color:#8fa1b8; margin-top:8px;
         min-height:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">G1 — Edge Terrain</div>
  <div class="sub">One path per market across pulls: x = model
    probability, y = market implied probability, z = time. The
    diagonal plane is fair (model = market). Cyan paths sit
    above fair — the model rates the bet above its price;
    orange paths sit below. Drag to orbit.</div>
  <div id="stamp">no pull history loaded yet</div>
  <div class="btns">
    <button id="btn-live" type="button">Live</button>
    <button id="btn-month" type="button">1 Month</button>
    <button id="btn-season" type="button">Season</button>
  </div>
  <canvas id="cv" width="660" height="450"></canvas>
  <div id="lab"></div>
</div>
<script>
(function () {
  var cv = document.getElementById('cv');
  var stampEl = document.getElementById('stamp');
  var labEl = document.getElementById('lab');
  var ctx = cv.getContext('2d');
  var payload = null;
  var win = 'live';
  (function () {
    // the panel's TIME control hands its window over as
    // ?window= — start there (own buttons can move after)
    var q = (window.location && window.location.search) || '';
    var m = /[?&]window=(live|month|season)\b/.exec(q);
    if (m) win = m[1];
  })();
  var yaw = -0.65, pitch = 0.52;
  var tmin = 0, tmax = 1;

  function setActive() {
    var map = { live: 'btn-live', month: 'btn-month',
                season: 'btn-season' };
    for (var k in map) {
      var b = document.getElementById(map[k]);
      if (b) b.className = (k === win) ? 'on' : '';
    }
  }

  function fitCanvas() {
    var r = cv.getBoundingClientRect();
    var w = Math.max(280, Math.floor(r.width || 660));
    cv.width = w;
    cv.height = Math.floor(w * 0.68);
  }

  function rot(x, y, z) {
    // center, yaw about the vertical (y) axis, then pitch
    var cx = x - 0.5, cy = y - 0.5, cz = z - 0.5;
    var c1 = Math.cos(yaw), s1 = Math.sin(yaw);
    var x1 = cx * c1 - cz * s1, z1 = cx * s1 + cz * c1;
    var c2 = Math.cos(pitch), s2 = Math.sin(pitch);
    var y2 = cy * c2 - z1 * s2, z2 = cy * s2 + z1 * c2;
    return [x1, y2, z2];
  }

  function project(x, y, z, w, h) {
    var r = rot(x, y, z);
    var s = Math.min(w, h) * 0.92;
    return [w / 2 + r[0] * s, h / 2 - r[1] * s, r[2]];
  }

  function line(a, b, style, width) {
    ctx.strokeStyle = style; ctx.lineWidth = width || 1;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  function draw() {
    var w = cv.width, h = cv.height;
    ctx.fillStyle = '#0e141f';
    ctx.fillRect(0, 0, w, h);
    ctx.font = '11px system-ui,sans-serif';
    // floor grid (y = 0): x and z rulings every quarter
    var i, a, b;
    for (i = 0; i <= 4; i++) {
      var f = i / 4;
      line(project(f, 0, 0, w, h), project(f, 0, 1, w, h),
           '#1b2839');
      line(project(0, 0, f, w, h), project(1, 0, f, w, h),
           '#1b2839');
    }
    // box edges
    line(project(0, 0, 0, w, h), project(0, 1, 0, w, h), '#2c3e55');
    line(project(0, 1, 0, w, h), project(1, 1, 0, w, h), '#2c3e55');
    line(project(1, 0, 0, w, h), project(1, 1, 0, w, h), '#2c3e55');
    // the fair diagonal, extruded along time
    for (i = 0; i <= 4; i++) {
      var z = i / 4;
      line(project(0, 0, z, w, h), project(1, 1, z, w, h),
           i === 0 || i === 4 ? '#3f7d5a' : '#274b3a');
    }
    line(project(0, 0, 1, w, h), project(1, 1, 1, w, h),
         '#3f7d5a', 2);
    var dm = project(0.72, 0.72, 1, w, h);
    ctx.fillStyle = '#7fc79b';
    ctx.fillText('fair — model = market', dm[0] + 6, dm[1]);
    // axis labels
    ctx.fillStyle = '#8fa1b8';
    var ax = project(1, 0, 0, w, h);
    ctx.fillText('model p →', ax[0] - 52, ax[1] + 16);
    var ay = project(0, 1, 0, w, h);
    ctx.fillText('implied p →', ay[0] + 4, ay[1] - 6);
    var az = project(0, 0, 1, w, h);
    ctx.fillText('time →', az[0] - 8, az[1] + 16);

    var paths = (payload && payload.series &&
                 payload.series.paths) || [];
    if (!paths.length) {
      ctx.fillStyle = '#a9bcd4';
      ctx.font = '13px system-ui,sans-serif';
      ctx.fillText('no market paths in this window yet — ' +
                   'history is accumulating', 18, 28);
      return;
    }
    // painter's order: far paths first (mean rotated depth)
    var deco = paths.map(function (p) {
      var pts = p.points.map(function (pt) {
        var z = (tmax > tmin) ? (pt[0] - tmin) / (tmax - tmin)
                              : 0.5;
        return project(pt[1], pt[2], z, w, h);
      });
      var depth = 0;
      pts.forEach(function (q) { depth += q[2]; });
      return { p: p, pts: pts,
               depth: depth / Math.max(1, pts.length) };
    });
    deco.sort(function (u, v) { return u.depth - v.depth; });
    deco.forEach(function (d, idx) {
      var last = d.p.points[d.p.points.length - 1];
      var above = last[1] >= last[2];
      var col = above ? '#35d0ff' : '#ff9a3c';
      ctx.strokeStyle = col; ctx.lineWidth = 1.4;
      ctx.globalAlpha = 0.75;
      ctx.beginPath();
      d.pts.forEach(function (q, j) {
        if (j === 0) ctx.moveTo(q[0], q[1]);
        else ctx.lineTo(q[0], q[1]);
      });
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = col;
      d.pts.forEach(function (q) {
        ctx.beginPath(); ctx.arc(q[0], q[1], 1.6, 0, 6.2832);
        ctx.fill();
      });
      var end = d.pts[d.pts.length - 1];
      ctx.beginPath(); ctx.arc(end[0], end[1], 3, 0, 6.2832);
      ctx.fill();
      if (idx >= deco.length - 8) {  // label the nearest few
        ctx.fillStyle = '#dbe4f0';
        ctx.font = '10px system-ui,sans-serif';
        ctx.fillText(d.p.label, end[0] + 6, end[1] - 4);
      }
    });
  }

  function stampLine() {
    if (!payload) return;
    var s = payload.series || {};
    var n = (s.paths || []).length;
    stampEl.textContent =
      'window ' + payload.window +
      ' · ' + (payload.from || '—') + ' → ' +
      (payload.to || '—') +
      ' · grain ' + payload.grain +
      ' · history begins ' + (payload.history_begins || '—') +
      ' · ' + n + ' paths' +
      (s.paths_total && s.paths_total !== n
        ? ' (' + s.paths_total + ' before the ' + s.cap +
          ' cap)' : '');
    labEl.textContent = n
      ? 'paths drawn: ' + n + ' — each point is one stamped ' +
        'pull; a path is one market living across pulls'
      : 'this window holds no priced market twice yet — ' +
        'a path needs the same market on two pulls';
  }

  function load() {
    setActive();
    if (typeof fetch !== 'function') {
      draw();
      return;
    }
    fetch('/api/history.json?window=' + win +
          '&graph=g1-edge-terrain')
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) {
            throw new Error('server said ' +
              (j.error || ('http ' + r.status)));
          }
          return j;
        });
      })
      .then(function (j) {
        payload = j;
        var pts = [];
        (j.series.paths || []).forEach(function (p) {
          p.points.forEach(function (pt) { pts.push(pt[0]); });
        });
        if (pts.length) {
          tmin = Math.min.apply(null, pts);
          tmax = Math.max.apply(null, pts);
        }
        stampLine();
        draw();
      })
      .catch(function (e) {
        stampEl.textContent = 'history feed failed: ' +
          e.message;
      });
  }

  ['live', 'month', 'season'].forEach(function (name) {
    var b = document.getElementById('btn-' + name);
    if (b) b.addEventListener('click', function () {
      win = name; load();
    });
  });

  var drag = null;
  cv.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    yaw += (e.clientX - drag.x) * 0.008;
    pitch += (e.clientY - drag.y) * 0.008;
    pitch = Math.max(-1.2, Math.min(1.2, pitch));
    drag = { x: e.clientX, y: e.clientY };
    draw();
  });
  cv.addEventListener('pointerup', function () { drag = null; });
  cv.addEventListener('pointerleave', function () {
    drag = null;
  });
  window.addEventListener('resize', function () {
    fitCanvas(); draw();
  });

  fitCanvas();
  load();
})();
</script>
</body>
</html>
