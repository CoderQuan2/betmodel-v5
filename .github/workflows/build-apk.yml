name: Build BetFi APK

# Builds the betmodel v5 Android app (public name: BetFi, internal
# id: Bet_Finder) with flet build apk and uploads the APKs as a
# workflow artifact. Runs on demand and on pushes to main.
#
# The artifact contains exactly TWO files:
#   Betmodel-v5.apk        (release build - the one to install)
#   Betmodel-v5-debug.apk  (debug build)
#
# Speed design (2026-10-19; the naive version took ~14.5 min):
# - The downloads are cached across runs: the Flutter SDK Flet
#   installs into ~/flutter, pub packages, and the Gradle
#   distribution + dependency caches. Setup becomes a restore.
# - The app is built ONCE. A second full `flet build` for the debug
#   variant repeated every expensive step (project generation,
#   Python packaging, pub get) when only Gradle's build type
#   differs - so the debug APK is produced by running the cached
#   Flutter directly in the project Flet generated (build/flutter).
# - --skip-flutter-doctor drops the doctor pass; its warnings are
#   desktop/web toolchains this Android build never uses.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Flutter SDK, pub and Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: Install Flet (pinned, same as requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the release APK
        # flet build fetches its own Flutter SDK on first run;
        # the default key signs this personal-use build.
        # --yes is REQUIRED in CI: without it flet stops to ask consent
        # to install the Flutter SDK and the run EOF-fails (run 1,
        # 2026-10-19). Flag verified against flet==1.0.4 --help.
        run: flet build apk --yes --skip-flutter-doctor --project "Betmodel" --product "Betmodel v5"

      - name: Stage the release APK (exactly one)
        run: |
          mkdir -p out
          count=$(find build/apk -maxdepth 1 -name '*.apk' | wc -l)
          echo "APKs in build/apk:"
          find build/apk -maxdepth 1 -name '*.apk'
          test "$count" -eq 1
          cp build/apk/*.apk out/Betmodel-v5.apk

      - name: Build and stage the debug APK (same generated project)
        # Flet generated the Flutter project in build/flutter and the
        # SDK it installed lives in ~/flutter/<version>. Building the
        # debug variant there reuses the packaged Python app, the pub
        # resolution and the Gradle caches - no second flet build.
        run: |
          FLUTTER=$(find ~/flutter -maxdepth 3 -path '*/bin/flutter' -type f | head -n 1)
          echo "flutter: $FLUTTER"
          test -n "$FLUTTER"
          (cd build/flutter && "$FLUTTER" build apk --debug)
          debug_apk=$(find build/flutter/build -name 'app-debug.apk' | head -n 1)
          echo "debug APK: $debug_apk"
          test -n "$debug_apk"
          cp "$debug_apk" out/Betmodel-v5-debug.apk
          ls -la out/

      - name: Upload the APKs (release + debug only)
        uses: actions/upload-artifact@v4
        with:
          name: betmodel-v5-apk
          path: out/*.apk
          if-no-files-found: error
