name: Build BetFi Xii APK

# Builds the BetFi Xii Android app (internal id: Bet_Finder —
# UNCHANGED by the Xii rename, so on-device data carries over;
# engine: betmodel v5.4) with flet build apk and uploads the
# APKs as a workflow artifact. Runs on demand and on pushes
# to main.
#
# App release v12 (2026-10-24) — BetFi Xii:
# - Project/product: "BetFi_Xii" / "BetFi Xii", version 12.11.0,
#   build 32; staged files BetFi-Xii.apk + BetFi-Xii-debug.apk;
#   artifact betfi-xii-apk.
# - BUILD 32 IMAGEBOARD CHANGE (2026-10-27): the widget card
#   system is deleted — every card is ONE PNG drawn with
#   Pillow (Design C odds-board rows on the Board, Design B
#   tickets on Finds and Parse; a tap expands to the drawn
#   depth + action bar), and group headers inside the
#   dynamic lists are drawn header images. Pillow is
#   pinned in requirements.txt for the renderer. Packaging
#   is build 29's universal APK, unchanged; the build-31
#   event-loop batched applier still streams the (now
#   image) controls.
# - BUILD 31 RENDER CHANGE (2026-10-27): the board and the
#   finds no longer ship one bulk patch from a worker thread
#   (plus a deferred re-ship). Renders are computed up front
#   and applied on the event loop in batches of <= 3 controls
#   (page.run_task + a sequence-stamped job; a superseded job
#   aborts) — the shape of the one add-path build 30's ladder
#   proved paints on the Pilot's device (a tap's small patch).
#   Build 30's diagnostic ladder is retired to opt-in
#   (BETFI_DIAGNOSTIC=1). Packaging is build 29's universal
#   APK, unchanged.
# - BUILD 30 IS A DIAGNOSTIC BUILD (2026-10-27): the app code
#   is build 29's plus the diagnostic ladder on the board
#   (BETFI_DIAGNOSTIC, default on) — minimal test cards seated
#   through every add-path so one device screenshot bisects
#   the card-rendering failure layer. Packaging is build 29's
#   universal APK, unchanged.
# - BUILD 29 PACKAGING CHANGE (2026-10-27): the release build no
#   longer uses --split-per-abi — it produces ONE universal APK,
#   exactly as every build up to 11.0.2 did. Reason: --split-per-abi
#   entered this workflow in 859828c (12.0.0), the precise commit
#   that opens the card-rendering regression window on the Pilot's
#   device (card outlines paint, contents never do, across eight
#   builds and three card implementations, while two matched-version
#   real clients render the same code fully). The staging step's
#   universal fallback (below) selects the single APK loudly.
# - Snapdragon 8 Gen 3 target (Galaxy S24 generation, Adreno
#   750, arm64-v8a): the release build uses --split-per-abi
#   (verified present in flet 1.0.4 --help) and the staging
#   step selects the arm64-v8a APK by name as BetFi-Xii.apk.
#   FALLBACK: if no arm64-v8a split is produced and exactly
#   one universal APK exists, that universal APK is staged
#   instead, with a loud warning in the log — a split failure
#   must never silently ship the wrong file or no file.
# - Icon: flet 1.0.4 `build apk` has NO --icon flag (verified
#   against --help 2026-10-24). The icon is wired by placing
#   the artist's icon.png at assets/icon.png (Flet's project
#   convention); do not invent an icon flag.
#
# App release v10 (2026-10-20): staging/artifact names moved to
# BetFi-10 (artifact betfi-10-apk); build mechanics unchanged
# from v7.
#
# App release v7 (2026-10-19) - this workflow's changelog:
# - Artifact contains exactly TWO files, staged into out/:
#     BetFi-10.apk        (release build - the one to install)
#     BetFi-10-debug.apk  (debug build)
#   (An earlier version uploaded build/**/*.apk and swept up three
#   files - Flet's final output plus Flutter/Gradle intermediates.)
# - Flet 1.0 API fixes in main.py: ft.run entry, ft.Button.
# - Speed (the v6 elements): the Flutter SDK Flet installs into
#   ~/flutter, pub packages and the Gradle caches are cached across
#   runs; the app is built ONCE and the debug APK is produced by
#   running the cached Flutter directly in the generated project
#   (build/flutter) instead of a second full flet build;
#   --skip-flutter-doctor drops the doctor pass.
# - Gradle cache patch: run #5's debug build died in Gradle's
#   project-local file-hash cache (fileHashes.bin, "Could not add
#   entry ... lib_pickle.so"). The debug step stops any Gradle
#   daemon and deletes build/flutter/android/.gradle so Gradle
#   rebuilds that cache clean instead of inheriting a bad one.
# - serious_python env: run #7's direct-Flutter debug build died
#   with "SERIOUS_PYTHON_SITE_PACKAGES environment variable is
#   not set" - Flet exports that set for its own flutter run and a
#   bare flutter invocation has to provide it. The debug step
#   exports exactly Flet's values, read from the build directory
#   Flet left behind (the Python version comes from Flet's own
#   build/.python-version marker, nothing hardcoded).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Flutter SDK, pub and Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: Install Flet (pinned, same as requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the release APK
        # flet build fetches its own Flutter SDK on first run;
        # the default key signs this personal-use build.
        # --yes is REQUIRED in CI: without it flet stops to ask consent
        # to install the Flutter SDK and the run EOF-fails (run 1,
        # 2026-10-19). Flag verified against flet==1.0.4 --help.
        run: flet build apk --yes --skip-flutter-doctor --project "BetFi_Xii" --product "BetFi Xii" --build-version "12.28.0" --build-number "49"

      - name: Stage the release APK (arm64-v8a split, selected by name)
        run: |
          mkdir -p out
          echo "APKs in build/apk:"
          find build/apk -maxdepth 1 -name '*.apk'
          arm64=$(find build/apk -maxdepth 1 -name '*arm64-v8a*.apk' | head -n 1)
          if [ -n "$arm64" ]; then
            echo "Selected arm64-v8a release APK: $arm64"
            cp "$arm64" out/BetFi-Xii.apk
          else
            count=$(find build/apk -maxdepth 1 -name '*.apk' | wc -l)
            echo "::warning::No arm64-v8a split APK found — falling back to the universal APK (count=$count)"
            test "$count" -eq 1
            cp build/apk/*.apk out/BetFi-Xii.apk
          fi
          ls -la out/

      - name: Build and stage the debug APK (same generated project)
        # Flet generated the Flutter project in build/flutter and the
        # SDK it installed lives in ~/flutter/<version>. Building the
        # debug variant there reuses the packaged Python app, the pub
        # resolution and the Gradle caches - no second flet build.
        # Gradle patch first: stop daemons and purge the project-local
        # .gradle cache whose fileHashes.bin failed in run #5.
        # Then export the serious_python environment Flet sets for
        # its own flutter run (values per flet_cli build_base.py):
        # the Android Gradle plugin refuses to build without them.
        run: |
          FLUTTER=$(find ~/flutter -maxdepth 3 -path '*/bin/flutter' -type f | head -n 1)
          echo "flutter: $FLUTTER"
          test -n "$FLUTTER"
          (cd build/flutter/android && ./gradlew --stop) || true
          rm -rf build/flutter/android/.gradle
          export SERIOUS_PYTHON_SITE_PACKAGES="$PWD/build/site-packages"
          export SERIOUS_PYTHON_APP="$PWD/build/python-app"
          export SERIOUS_PYTHON_VERSION="$(cat build/.python-version)"
          echo "site-packages: $SERIOUS_PYTHON_SITE_PACKAGES"
          echo "python-app:    $SERIOUS_PYTHON_APP"
          echo "python:        $SERIOUS_PYTHON_VERSION"
          test -d "$SERIOUS_PYTHON_SITE_PACKAGES"
          test -d "$SERIOUS_PYTHON_APP"
          (cd build/flutter && "$FLUTTER" build apk --debug)
          debug_apk=$(find build/flutter/build -name '*arm64-v8a*debug.apk' | head -n 1)
          if [ -z "$debug_apk" ]; then
            debug_apk=$(find build/flutter/build -name 'app-debug.apk' | head -n 1)
          fi
          echo "debug APK: $debug_apk"
          test -n "$debug_apk"
          cp "$debug_apk" out/BetFi-Xii-debug.apk
          ls -la out/

      - name: Upload the APKs (release + debug only)
        uses: actions/upload-artifact@v4
        with:
          name: betfi-xii-apk
          path: out/*.apk
          if-no-files-found: error
